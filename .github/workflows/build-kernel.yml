name: Build kernel

on:
  workflow_dispatch:
  push:
    branches:
      - testing-old-wifi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            curl \
            flex \
            git \
            jq \
            libelf-dev \
            libssl-dev \
            make \
            python3 \
            rsync \
            unzip \
            zip

      - name: Build
        run: bash ./build.sh

      - name: Upload AnyKernel zip
        uses: actions/upload-artifact@v4
        with:
          name: boomksu-anykernel-${{ github.sha }}
          path: AnyKernel3/*.zip
          if-no-files-found: error
